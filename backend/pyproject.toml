[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zentrix-backend"
version = "0.1.0"
description = "Zentrix trading assistant: API, ML signal engine, knowledge base"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.8",
    "redis>=5.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "prometheus-client>=0.20",   # /metrics (API) and the worker metrics port
    "sentry-sdk>=2.0",           # error tracking, off until SENTRY_DSN is set
]

[project.optional-dependencies]
# Heavy (pulls torch). Only needed for the knowledge retriever.
knowledge = ["chromadb>=0.5", "sentence-transformers>=3.0"]
llm = ["google-genai>=1.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.23",
    "pgserver>=0.1.4",   # bundled PostgreSQL 16 for tests and local dev (no Docker needed)
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*", "ml*", "knowledge*"]

[tool.setuptools.package-data]
ml = ["config/*.yaml"]
knowledge = ["source_docs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "network: hits a live external API (deselect with -m 'not network')",
    "slow: long-running",
    "db: needs PostgreSQL (started automatically via pgserver)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
# Markdown table templates in the report generator are intentionally long.
"ml/demo_trading_logger/accuracy_report.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]  # autogenerated DDL
