[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zentrix-backend"
version = "0.1.0"
description = "Zentrix trading assistant: API, ML signal engine, knowledge base"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Heavy (pulls torch). Only needed for the knowledge retriever.
knowledge = ["chromadb>=0.5", "sentence-transformers>=3.0"]
news = ["feedparser>=6.0"]
llm = ["google-genai>=1.0"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*", "ml*", "knowledge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -p no:anyio"
markers = [
    "network: hits a live external API (deselect with -m 'not network')",
    "slow: long-running",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
