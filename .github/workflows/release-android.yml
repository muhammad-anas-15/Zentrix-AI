# Signed Android App Bundle for Google Play, built on demand (Actions > Android release > Run workflow).
#
# Repository (or "release" environment) secrets, see docs/PLAY_STORE.md:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   SENTRY_DSN (optional)
# The bundle is signed with the UPLOAD key; Google Play App Signing re-signs it for users.
name: Android release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (https://...)"
        required: true
      google_server_client_id:
        description: "Google OAuth web client ID (audience the API verifies)"
        required: true
      privacy_url:
        description: "Privacy policy URL (shown in Settings)"
        required: true
      terms_url:
        description: "Terms of use URL"
        required: true
      build_name:
        description: "Version name, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release   # add required reviewers here to approve each release build
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Upload key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - name: Build the signed App Bundle
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter build appbundle --release
          --build-name="${{ inputs.build_name }}" --build-number="${{ github.run_number }}"
          --obfuscate --split-debug-info=build/symbols
          --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"
          --dart-define=GOOGLE_SERVER_CLIENT_ID="${{ inputs.google_server_client_id }}"
          --dart-define=PRIVACY_URL="${{ inputs.privacy_url }}"
          --dart-define=TERMS_URL="${{ inputs.terms_url }}"
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=APP_ENV=prod
      - name: Remove the key from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: zentrix-${{ inputs.build_name }}-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/symbols
          retention-days: 30
